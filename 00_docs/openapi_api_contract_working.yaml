  /me/ai-providers:
    get:
      tags: [Me]
      summary: List own AI provider connections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AiProvider' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Me]
      summary: Add an AI provider connection
      description: |
        Encrypts `api_key` with Laravel's APP_KEY before storing. The key is
        **never** returned in any response — only the `has_key` boolean.
        A user can have at most one row per `provider` value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAiProviderRequest' }
      responses:
        '201':
          description: Provider added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProvider' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/ai-providers/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'

    put:
      tags: [Me]
      summary: Update an AI provider connection
      description: |
        Send `api_key` to rotate the encrypted key. Omit it to keep the
        existing one. Foreign IDs return 404 (not 403) to avoid leaking
        which rows exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAiProviderRequest' }
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProvider' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Me]
      summary: Remove an AI provider connection
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/ai-providers/{provider_id}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      tags: [Me]
      summary: Test connectivity of an AI provider
      description: |
        Decrypts the user's key and probes the upstream with a minimal HTTP
        GET. Returns 200 with `{ok, reachable, status, code, message,
        latency_ms}` regardless of outcome — the `code` field lets the UI
        pick the right user-facing message.
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProviderTestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════════════════════════════════════════════════════
  # AI CHAT — per-user streaming
  # ════════════════════════════════════════════════════════════════════════════

  /ai/chat:
    post:
      tags: [AIChat]
      summary: Stream an AI chat completion (per-user key)
      description: |
        Streams an Anthropic-SSE completion back to the client.

        The browser sends the user's chosen `provider_id`; the backend
        decrypts that row's `api_key_encrypted` and uses its `base_url`.
        One user can carry multiple providers (MiniMax, Anthropic, LM Studio,
        …) — `provider_id` selects which one carries this request.

        The browser never sees the API key. The shared `ANTHROPIC_AUTH_TOKEN`
        env var that this endpoint used to read was removed in v1.0.4.

        ## Stream framing
        Returns `text/event-stream`. Each frame is a single Anthropic SSE
        event of the form:

            event: <type>
            data: <json>
            <blank line>

        The client should consume `event: content_block_delta` /
        `data: <json>` frames and read `delta.text` to render tokens as they
        arrive. `event: message_stop` ends the stream. If the stream breaks
        after headers were sent, a final `event: error` / `data: <json>`
        frame is appended.

        ## Error cases
        Non-2xx responses are JSON (see `AiChatErrorResponse`). The most
        common codes:
          - `provider_not_found` (404) — `provider_id` is not in the user's set
          - `model_required`     (422) — neither request `model` nor `provider.default_model` is set
          - `anthropic_key_missing` (502) — provider row has no key, or the encrypted blob is unreadable
          - `upstream_unreachable`  (502) — network error reaching the upstream
          - `upstream_error`        (502) — upstream returned a non-2xx status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatRequest' }
      responses:
        '200':
          description: SSE stream of Anthropic events (one per frame)
          headers:
            Content-Type:
              schema: { type: string, example: "text/event-stream" }
            Cache-Control:
              schema: { type: string, example: "no-cache" }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Anthropic SSE stream — see `AiChatStreamEvent` for the
                  event shapes. Clients typically use a streaming JSON
                  parser that splits on `\n\n` and reads each frame's
                  `event:` + `data:` lines.
              examples:
                contentBlockDelta:
                  summary: A typical content_block_delta frame
                  value: |
                    event: content_block_delta
                    data: {"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Hello"}}
                messageStop:
                  summary: Stream end
                  value: |
                    event: message_stop
                    data: {"type":"message_stop"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AiChatProviderNotFound' }
        '422':
          description: |
            Validation error (missing `provider_id`, invalid UUID, missing
            `messages`, invalid `role`, …) OR `model_required`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/AiChatErrorResponse'
        '502': { $ref: '#/components/responses/AiChatUpstream' }

  # ════════════════════════════════════════════════════════════════════════════
  # TYPES
  # ════════════════════════════════════════════════════════════════════════════

  /types:
    get:
      tags: [Types]
      summary: List all output types
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Type' } }

  # ════════════════════════════════════════════════════════════════════════════
  # TEMPLATES
  # ════════════════════════════════════════════════════════════════════════════

  /templates:
    get:
      tags: [Templates]
      summary: Browse public template gallery
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: type_id
          in: query
          schema: { type: string, format: uuid }
        - name: tags
          in: query
          description: "Comma-separated tag list"
          schema: { type: string, example: "business,pitch" }
        - name: q
          in: query
          description: "Keyword search on name and description"
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, newest, most_forked], default: popular }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Template' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

    post:
      tags: [Templates]
      summary: Create a new template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'

    get:
      tags: [Templates]
      summary: Get template by ID
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Templates]
      summary: Update template (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTemplateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Templates]
      summary: Soft-delete template (owner only)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /templates/{template_id}/fork:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Templates]
      summary: Fork a public template into a new project
      requestBody:
