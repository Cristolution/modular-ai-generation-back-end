openapi: 3.0.3

info:
  title: MGF — Modular Generation Framework API
  description: |
    REST API for the MGF platform. All endpoints are prefixed with `/v1`.

    ## Authentication
    All protected routes require a Bearer token obtained from `POST /auth/login`.
    Pass it as: `Authorization: Bearer <token>`

    ## AI Generation — per-user keys
    Every user brings their own AI keys (Anthropic, OpenAI, Gemini, LM Studio,
    or a custom MiniMax-style proxy). Keys are stored encrypted in
    `user_ai_providers` and decrypted server-side per request — they are
    **never** sent to the browser.

    Generation calls reference a specific `provider_id` (the user's saved row)
    so the backend knows whose key, base URL, and default model to use.

    Pagination, error formats, and other conventions are unchanged from v1.0.3.

    ## Pagination
    List endpoints support `?page=1&per_page=20`. Response includes a `meta` pagination object.

    ## Error Format
    All errors return `{ "message": "...", "errors": { "field": ["..."] } }` (422)
    or `{ "error": "...", "code": "..." }` for typed AI errors (404 / 422 / 502).
  version: 1.0.4
  contact:
    name: MGF Team

servers:
  - url: http://mgf.vortex-tech.tech/api/v1/
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────────────────────────────────────

security:
  - BearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# TAGS (module grouping)
# ─────────────────────────────────────────────────────────────────────────────

tags:
  - name: Auth
    description: Registration, login, session management
  - name: Me
    description: Authenticated user — profile and AI provider config
  - name: AIChat
    description: Per-user streaming chat completions (Anthropic SSE)
  - name: Types
    description: Output type catalogue (presentation, poster, carousel…)
  - name: Templates
    description: Community templates — browse, create, fork or created from scratch
  - name: Projects
    description: User's personal projects (forks or created from scratch)
  - name: Files
    description: Modular file layers within a template or project
  - name: Generation
    description: AI generation jobs — full project or per-layer
  - name: Export
    description: Export a project to HTML / PDF / PNG / PPTX / ZIP / MD
  - name: Resources
    description: Community AI resource library (prompts, skills, agents, MCPs…)
  - name: Social
    description: Upvotes, comments, bookmarks — polymorphic across templates and resources
  - name: Admin
    description: Administration — user management and content moderation (admin only)

# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Parameters ─────────────────────────────────────────────────────────────

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    TemplateId:
      name: template_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  # ── Schemas ─────────────────────────────────────────────────────────────────

  schemas:

    # ── Pagination ──────────────────────────────────────────────────────────

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page:     { type: integer, example: 20 }
        total:        { type: integer, example: 143 }
        last_page:    { type: integer, example: 8 }
        from:         { type: integer, nullable: true, description: "First item index (1-based)" }
        to:           { type: integer, nullable: true, description: "Last item index" }
        path:         { type: string, description: "Current request path" }
        link:         { type: array, description: "Pagination navigation links",
          items: { type: object, properties: { url: { type: string, nullable: true }, label: { type: string }, page: { type: integer, nullable: true }, active: { type: boolean } } } }

    # ── Auth ────────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:                  { type: string, example: "Alex Johnson" }
        email:                 { type: string, format: email }
        password:              { type: string, minLength: 8 }
        password_confirmation: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string, example: "1|abc123..." }
        user:  { $ref: '#/components/schemas/User' }

    # ── User ────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        email:      { type: string, format: email }
        role:       { type: string, enum: [user, admin] }
        profile:    { $ref: '#/components/schemas/UserProfile' }
        created_at: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        bio:        { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        website:    { type: string, nullable: true }
        location:   { type: string, nullable: true }

    UpdateProfileRequest:
      type: object
      properties:
        name:       { type: string }
        bio:        { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        website:    { type: string, nullable: true }
        location:   { type: string, nullable: true }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [user, admin] }

    # ── AI Provider ─────────────────────────────────────────────────────────

    AiProvider:
      type: object
      properties:
        id:            { type: string, format: uuid }
        provider:      { type: string, enum: [openai, anthropic, gemini, local, custom] }
        display_name:  { type: string, example: "My LM Studio" }
        base_url:      { type: string, example: "http://localhost:1234/v1" }
        default_model: { type: string, example: "gpt-4o" }
        has_key:       { type: boolean, description: "True if an API key is stored — key itself is never returned" }
        is_active:     { type: boolean }
        created_at:    { type: string, format: date-time }

    CreateAiProviderRequest:
      type: object
      required: [provider, base_url]
      properties:
        provider:      { type: string, enum: [openai, anthropic, gemini, local, custom] }
        display_name:  { type: string }
        api_key:       { type: string, description: "Encrypted server-side. Never returned in responses.", nullable: true }
        base_url:      { type: string, example: "https://api.openai.com/v1" }
        default_model: { type: string }

    UpdateAiProviderRequest:
      type: object
      properties:
        display_name:  { type: string }
        api_key:       { type: string, nullable: true, description: "Send to rotate the key" }
        base_url:      { type: string }
        default_model: { type: string }
        is_active:     { type: boolean }

    AiProviderTestResponse:
      type: object
      description: "Diagnostic body for `POST /me/ai-providers/{id}/test`. Always returned as 200 so the UI can show `ok`/`code` directly."
      properties:
        ok:         { type: boolean, description: "True if the upstream returned a 2xx status" }
        reachable:  { type: boolean, description: "True if any HTTP response was received (any status < 500, including 401/404)" }
        status:     { type: integer, nullable: true, description: "Upstream HTTP status, or 0 if no response" }
        code:       { type: string, enum: [ok, upstream_error, unreachable, connection_failed, provider_not_found] }
        message:    { type: string }
        latency_ms: { type: integer }
        class:      { type: string, nullable: true, description: "Exception class name when `code=connection_failed`" }

    # ── AI Chat (per-user, streaming) ──────────────────────────────────────

    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role:    { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1 }

    AiChatRequest:
      type: object
      description: |
        Per-user streaming chat. The `provider_id` MUST belong to the
        authenticated user — foreign IDs return 404 with the same shape
        as missing rows, so IDs cannot be enumerated.

        The upstream API key is read from `user_ai_providers.api_key_encrypted`
        and decrypted with Laravel's APP_KEY; the browser never sees it.
      required: [provider_id, messages]
      properties:
        provider_id:
          type: string
          format: uuid
          description: "UUID of the user's `user_ai_providers` row that carries this request's API key + base URL"
        model:
          type: string
          nullable: true
          description: |
            Model ID (e.g. `MiniMax-M3`, `claude-3-5-sonnet-latest`). Optional —
            falls back to `provider.default_model` if omitted or empty.
        system:
          type: string
          nullable: true
          maxLength: 100000
          description: "Optional system prompt prepended to the conversation"
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AiChatMessage' }
        max_tokens:
          type: integer
          nullable: true
          minimum: 1
          maximum: 8192
          default: 4096

    AiChatErrorResponse:
      type: object
      description: "JSON error body returned for non-2xx before the SSE stream starts (or as a final SSE event when the stream breaks)."
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - anthropic_key_missing
            - upstream_unreachable
            - upstream_error
            - provider_not_found
            - model_required
            - stream_error

    AiChatStreamEvent:
      type: object
      description: |
        A single Anthropic SSE event. The endpoint streams these verbatim
        in `text/event-stream` format with `event:` and `data:` lines
        separated by `\n\n`. Frontend clients SHOULD reuse a parser that
        handles `content_block_delta.delta.text`, `message_stop`, and the
        optional final `event: error` event for stream interruptions.
      properties:
        type:
          type: string
          enum:
            - message_start
            - content_block_start
            - content_block_delta
            - content_block_stop
            - message_delta
            - message_stop
            - ping
            - error
        index: { type: integer, nullable: true }
        message:
          type: object
          nullable: true
          description: "Present on `message_start`. Carries the assistant message id, role, and usage."
        content_block:
          type: object
          nullable: true
          description: "Present on `content_block_start`."
        delta:
          type: object
          nullable: true
          description: "Present on `content_block_delta` (carries `delta.text`) and `message_delta` (carries stop_reason + usage)."
        usage:
          type: object
          nullable: true
          properties:
            input_tokens:               { type: integer }
            output_tokens:              { type: integer }
            cache_read_input_tokens:    { type: integer, nullable: true }
            service_tier:               { type: string, nullable: true }
        error:
          type: object
          nullable: true
          description: "Present on the final `event: error` SSE event when the stream breaks after headers were sent."

    # ── Type ────────────────────────────────────────────────────────────────

    Type:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string, example: "presentation" }
        description: { type: string }
        icon:        { type: string, example: "slides" }

    # ── Template ────────────────────────────────────────────────────────────

    Template:
      type: object
      properties:
        id:            { type: string, format: uuid }
        user_id:       { type: string, format: uuid }
        author:        { $ref: '#/components/schemas/UserSummary' }
        type:          { $ref: '#/components/schemas/Type' }
        name:          { type: string }
        description:   { type: string, nullable: true }
        thumbnail_url: { type: string, nullable: true }
        visibility:    { type: string, enum: [public, private, unlisted] }
        tags:          { type: array, items: { type: string } }
        locale:        { type: string, example: "en" }
        direction:     { type: string, enum: [ltr, rtl] }
        fork_count:    { type: integer, description: "Derived — count of projects forked from this template" }
        upvote_count:  { type: integer }
        is_upvoted:    { type: boolean, description: "Authenticated user's upvote status" }
        is_bookmarked: { type: boolean }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }

    CreateTemplateRequest:
      type: object
      required: [type_id, name]
      properties:
        type_id:     { type: string, format: uuid }
        name:        { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        visibility:  { type: string, enum: [public, private, unlisted], default: private }
        tags:        { type: array, items: { type: string } }
        locale:      { type: string, default: "en" }
        direction:   { type: string, enum: [ltr, rtl], default: ltr }

    UpdateTemplateRequest:
      type: object
      properties:
        name:          { type: string }
        description:   { type: string, nullable: true }
        thumbnail_url: { type: string, nullable: true }
        visibility:    { type: string, enum: [public, private, unlisted] }
        tags:          { type: array, items: { type: string } }

    # ── Project ─────────────────────────────────────────────────────────────

    Project:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        user_id:              { type: string, format: uuid }
        template_id:          { type: string, format: uuid, nullable: true }
        type:                 { $ref: '#/components/schemas/Type' }
        origin_template_name: { type: string, nullable: true }
        name:                 { type: string }
        description:          { type: string, nullable: true }
        status:               { type: string, enum: [draft, published, archived] }
        visibility:           { type: string, enum: [public, private, unlisted] }
        tags:                 { type: array, items: { type: string } }
        locale:               { type: string }
        direction:            { type: string, enum: [ltr, rtl] }
        cloned_at:            { type: string, format: date-time, nullable: true }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [type_id, name]
      properties:
        type_id:     { type: string, format: uuid }
        name:        { type: string }
        description: { type: string, nullable: true }
        visibility:  { type: string, enum: [public, private, unlisted], default: private }
        tags:        { type: array, items: { type: string } }
        locale:      { type: string, default: "en" }
        direction:   { type: string, enum: [ltr, rtl], default: ltr }

    UpdateProjectRequest:
      type: object
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }
        status:      { type: string, enum: [draft, published, archived] }
        visibility:  { type: string, enum: [public, private, unlisted] }
        tags:        { type: array, items: { type: string } }

    ForkTemplateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Name for the newly created project" }

    # ── File ────────────────────────────────────────────────────────────────

    File:
      type: object
      properties:
        id:           { type: string, format: uuid }
        template_id:  { type: string, format: uuid, nullable: true }
        project_id:   { type: string, format: uuid, nullable: true }
        layer:        { type: string, enum: [slide, style, layout, content, context, rules, meta, asset] }
        name:         { type: string, example: "slide-01.html" }
        extension:    { type: string, example: "html" }
        sort_order:   { type: integer }
        content:      { type: string, nullable: true, description: "File body (DB-stored, <~100KB)" }
        storage_url:  { type: string, nullable: true, description: "Signed URL for S3-stored files" }
        size_bytes:   { type: integer, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    CreateFileRequest:
      type: object
      required: [layer, name, extension]
      properties:
        layer:      { type: string, enum: [slide, style, layout, content, context, rules, meta, asset] }
        name:       { type: string, example: "slide-02.html" }
        extension:  { type: string, example: "html" }
        sort_order: { type: integer, default: 0 }
        content:    { type: string, nullable: true }

    UpdateFileRequest:
      type: object
      properties:
        name:       { type: string }
        content:    { type: string }
        sort_order: { type: integer }

    ReorderFilesRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          description: "Array of file IDs in desired order"
          items: { type: string, format: uuid }

    # ── AI Generation (job-based, async) ────────────────────────────────────

    GenerateFullRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id: { type: string, format: uuid, description: "Which user_ai_provider to use" }
        model:       { type: string, description: "Overrides provider default_model if set" }
        prompt:      { type: string, description: "Top-level generation prompt. Falls back to context.md if omitted." }

    GenerateLayerRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id: { type: string, format: uuid }
        model:       { type: string }
        prompt:      { type: string, nullable: true, description: "Optional override — uses context.md + rules.md otherwise" }

    AiJob:
      type: object
      properties:
        id:           { type: string, format: uuid }
        project_id:   { type: string, format: uuid, nullable: true }
        template_id:  { type: string, format: uuid, nullable: true }
        file_id:      { type: string, format: uuid, nullable: true }
        provider_id:  { type: string, format: uuid, nullable: true }
        provider:     { type: string }
        model:        { type: string }
        layer:        { type: string, nullable: true }
        status:       { type: string, enum: [pending, running, success, failed] }
        error_message: { type: string, nullable: true }
        tokens_used:  { type: integer, nullable: true }
        duration_ms:  { type: integer, nullable: true }
        created_at:   { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    # ── Export ──────────────────────────────────────────────────────────────

    ExportRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [html, pdf, png, jpg, pptx, zip, md]
        options:
          type: object
          properties:
            page_size:  { type: string, enum: [A4, letter, custom], default: A4 }
            width_px:   { type: integer, description: "For custom page_size or PNG/JPG" }
            height_px:  { type: integer }
            quality:    { type: integer, minimum: 1, maximum: 100, default: 90, description: "For JPG" }
            slides:
              type: array
              description: "Export specific slide IDs only. Omit to export all."
              items: { type: string, format: uuid }

    ExportJob:
      type: object
      properties:
        id:           { type: string, format: uuid }
        project_id:   { type: string, format: uuid }
        format:       { type: string }
        status:       { type: string, enum: [pending, processing, ready, failed] }
        download_url: { type: string, nullable: true, description: "Signed URL — available when status=ready" }
        expires_at:   { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true, description: "Available when status=failed" }
        created_at:   { type: string, format: date-time }

    # ── Resource ────────────────────────────────────────────────────────────

    Resource:
      type: object
      properties:
        id:              { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        author:          { $ref: '#/components/schemas/UserSummary' }
        forked_from_id:  { type: string, format: uuid, nullable: true }
        kind:            { type: string, enum: [prompt, skill, agent, rule, mcp, design_doc, hook] }
        name:            { type: string }
        description:     { type: string, nullable: true }
        content:         { type: string }
        placeholders:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:     { type: string }
              label:   { type: string }
              default: { type: string }
              type:    { type: string, enum: [text, textarea, select] }
        visibility:    { type: string, enum: [public, private, unlisted] }
        tags:          { type: array, items: { type: string } }
        upvote_count:  { type: integer }
        fork_count:    { type: integer }
        is_upvoted:    { type: boolean }
        is_bookmarked: { type: boolean }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }

    CreateResourceRequest:
      type: object
      required: [kind, name, content]
      properties:
        kind:         { type: string, enum: [prompt, skill, agent, rule, mcp, design_doc, hook] }
        name:         { type: string }
        description:  { type: string, nullable: true }
        content:      { type: string }
        placeholders: { type: array, items: { type: object } }
        visibility:   { type: string, enum: [public, private, unlisted], default: private }
        tags:         { type: array, items: { type: string } }

    UpdateResourceRequest:
      type: object
      properties:
        name:         { type: string }
        description:  { type: string, nullable: true }
        content:      { type: string }
        placeholders: { type: array, items: { type: object } }
        visibility:   { type: string, enum: [public, private, unlisted] }
        tags:         { type: array, items: { type: string } }

    ForkResourceRequest:
      type: object
      properties:
        name: { type: string, description: "Optional custom name for the fork. Defaults to 'Fork of <original name>'" }

    # ── Social ──────────────────────────────────────────────────────────────

    Comment:
      type: object
      properties:
        id:          { type: string, format: uuid }
        user_id:     { type: string, format: uuid }
        author:      { $ref: '#/components/schemas/UserSummary' }
        target_id:   { type: string, format: uuid }
        target_type: { type: string, enum: [template, resource] }
        parent_id:   { type: string, format: uuid, nullable: true }
        body:        { type: string }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:      { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true, description: "Set to reply to an existing comment" }

    UpvoteResponse:
      type: object
      properties:
        upvoted:      { type: boolean }
        upvote_count: { type: integer }

    BookmarkResponse:
      type: object
      properties:
        bookmarked: { type: boolean }

    # ── Shared ──────────────────────────────────────────────────────────────

    UserSummary:
      type: object
      description: "Lightweight user object embedded in other resources"
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        avatar_url: { type: string, nullable: true }

    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  # ── Responses ───────────────────────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AiChatProviderNotFound:
      description: |
        `provider_id` is not a row belonging to the authenticated user. Same
        body shape for foreign and missing IDs — IDs cannot be enumerated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AiChatErrorResponse' }
    AiChatModelRequired:
      description: |
        Neither the request `model` nor the provider row's `default_model`
        is set. Client should pick a model or update the provider.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AiChatErrorResponse' }
    AiChatUpstream:
      description: |
        The user's API key is missing/unreadable, the upstream is unreachable,
        or the upstream returned a non-2xx status. Body always carries `code`
        so the client can pick a recovery path (re-prompt for the key, retry,
        surface the upstream error, …).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AiChatErrorResponse' }

