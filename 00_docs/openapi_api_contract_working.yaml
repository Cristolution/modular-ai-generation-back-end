        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/File' } }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Projects]
      summary: Add a file to a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201':
          description: File created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

  /projects/{project_id}/files/reorder:
