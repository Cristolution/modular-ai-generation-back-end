    patch:
      tags: [Projects]
      summary: Reorder slides/pages within a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderFilesRequest' }
      responses:
        '200':
          description: Files reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/File' } }

  /projects/{project_id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'

    get:
      tags: [Projects]
      summary: Get a single project file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

    put:
      tags: [Projects]
      summary: Update file content (autosave)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

    delete:
      tags: [Projects]
      summary: Delete a project file
      responses:
        '204': { description: Deleted }

  # ════════════════════════════════════════════════════════════════════════════
  # AI GENERATION
  # ════════════════════════════════════════════════════════════════════════════

  /projects/{project_id}/generate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Generation]
      summary: Generate all layers of a project with AI
      description: |
        Reads `context.md` and `rules.md` from the project files, calls the AI provider,
        and regenerates all layers (content, slides, style). Creates an `ai_job` record.
        Generation runs asynchronously — poll `/projects/{id}/jobs` or wait for the returned job status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateFullRequest' }
      responses:
        '202':
          description: Generation job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{project_id}/files/{file_id}/generate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [Generation]
      summary: Regenerate a single file/layer with AI
      description: |
        Targets only the specified file. Uses the project's `context.md` and `rules.md`
        as context unless `prompt` is explicitly provided in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateLayerRequest' }
      responses:
        '202':
          description: Generation job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{project_id}/jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Generation]
      summary: List AI generation job history for a project
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AiJob' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Generation]
      summary: Poll a specific AI job by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════════════════════════════════════════════════════
  # EXPORT
  # ════════════════════════════════════════════════════════════════════════════

  /projects/{project_id}/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Export]
      summary: Request an export of a project
      description: |
        Queues an export job. Poll the returned `ExportJob` until `status=ready`,
        then download via `download_url` (signed URL, expires in 1 hour).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /export-jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Export]
      summary: Poll export job status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════════════════════════════════════════════════════
  # RESOURCES (Community Library)
  # ════════════════════════════════════════════════════════════════════════════

  /resources:
    get:
      tags: [Resources]
      summary: Browse public community resources
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: kind
          in: query
          schema: { type: string, enum: [prompt, skill, agent, rule, mcp, design_doc, hook] }
        - name: q
          in: query
          schema: { type: string }
        - name: tags
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [popular, newest, most_forked], default: popular }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Resource' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

    post:
      tags: [Resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /resources/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Resources]
      summary: Get a resource by ID
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Resources]
      summary: Update a resource (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateResourceRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '403': { $ref: '#/components/responses/Forbidden' }

    delete:
      tags: [Resources]
      summary: Soft-delete a resource (owner only)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /resources/{resource_id}/fork:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Resources]
      summary: Fork a public resource into own library
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForkResourceRequest' }
      responses:
        '201':
          description: Forked resource created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /resources/{resource_id}/forks:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: List public forks of a resource
      parameters:
