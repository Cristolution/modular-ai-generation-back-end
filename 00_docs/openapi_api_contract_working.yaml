      - $ref: '#/components/parameters/TemplateId'

    get:
      tags: [Templates]
      summary: List all files in a template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/File' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Templates]
      summary: Add a file to a template (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201':
          description: File created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

  /templates/{template_id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/FileId'

    get:
      tags: [Templates]
      summary: Get a single template file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

    put:
      tags: [Templates]
      summary: Update file content or metadata (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }

    delete:
      tags: [Templates]
      summary: Delete a template file
      responses:
        '204': { description: Deleted }

